<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthSeeker AI - 智能第一性原理分析</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 自定义动画样式 -->
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 50% { opacity: .5; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .slide-in-from-right { animation: slideInRight 0.5s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .zoom-in-95 { animation: zoomIn 0.4s ease-out forwards; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- API 调用辅助函数 ---
        const callOpenAI = async (apiKey, messages, onChunk) => {
            if (!apiKey) {
                throw new Error("请先在设置中配置 OpenAI API Key");
            }

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-5.1", // 或者 gpt-4
                        messages: messages,
                        temperature: 0.7,
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data.choices[0].message.content;
            } catch (error) {
                console.error("AI API Error:", error);
                throw error;
            }
        };

        // --- 图标组件 (SVG) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        const Brain = (props) => (<IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z" /><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" /></IconBase>);
        const ArrowRight = (props) => (<IconBase {...props}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconBase>);
        const ArrowLeft = (props) => (<IconBase {...props}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>);
        const CheckCircle = (props) => (<IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m9 11 3 3L22 4" /></IconBase>);
        const Target = (props) => (<IconBase {...props}><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></IconBase>);
        const Search = (props) => (<IconBase {...props}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></IconBase>);
        const ShieldAlert = (props) => (<IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="M12 8v4" /><path d="M12 16h.01" /></IconBase>);
        const Lightbulb = (props) => (<IconBase {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></IconBase>);
        const Copy = (props) => (<IconBase {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></IconBase>);
        const Layers = (props) => (<IconBase {...props}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></IconBase>);
        const Sparkles = (props) => (<IconBase {...props}><path d="m12 3-1.91 6.2a2 2 0 0 1-1.65 1.65L2.25 12l6.2 1.91a2 2 0 0 1 1.65 1.65L12 21.75l1.91-6.2a2 2 0 0 1 1.65-1.65L21.75 12l-6.2-1.91a2 2 0 0 1-1.65-1.65z" /></IconBase>);
        const Settings = (props) => (<IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></IconBase>);
        const Loader = (props) => (<IconBase {...props} className={`${props.className} animate-spin`}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></IconBase>);

        // --- 组件：AI 辅助按钮 ---
        const AIAssistButton = ({ context, promptType, apiKey, onResult }) => {
            const [loading, setLoading] = useState(false);
            const [suggestion, setSuggestion] = useState(null);

            const handleAnalyze = async () => {
                if (!apiKey) {
                    alert("请先点击左下角设置图标，配置您的 API Key");
                    return;
                }
                setLoading(true);
                setSuggestion(null);

                const systemPrompt = "你是一位精通第一性原理的资深产品经理。请基于用户输入，用简短、启发性的语言提供建议。直接给出建议内容，不要寒暄。";
                
                let userPrompt = "";
                if (promptType === "trigger") {
                    userPrompt = `用户填写了触发场景："${context}"。请分析这背后可能的深层痛点是什么？给出一个可能的深层原因推测。`;
                } else if (promptType === "why") {
                    userPrompt = `针对需求/问题："${context}"。请提供一个能引导用户挖掘根因的"为什么"追问，或者推测一个可能的底层原因。`;
                } else if (promptType === "constraint") {
                    userPrompt = `用户提到的假设/事实是："${context}"。请反向挑战这个假设，或者补充用户可能忽略的物理限制。`;
                } else if (promptType === "metric") {
                    userPrompt = `针对问题上下文："${context}"。请推荐一个定量的、可衡量的成功指标（North Star Metric）。`;
                }

                try {
                    const result = await callOpenAI(apiKey, [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt }
                    ]);
                    setSuggestion(result);
                } catch (e) {
                    alert("AI 请求失败: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="mt-2">
                    {!suggestion && (
                        <button 
                            onClick={handleAnalyze}
                            disabled={loading || !context}
                            className={`text-xs flex items-center px-3 py-1.5 rounded-full border transition-colors ${
                                loading || !context 
                                ? 'bg-slate-100 text-slate-400 border-slate-200' 
                                : 'bg-indigo-50 text-indigo-600 border-indigo-200 hover:bg-indigo-100'
                            }`}
                        >
                            {loading ? <Loader className="w-3 h-3 mr-1" /> : <Sparkles className="w-3 h-3 mr-1" />}
                            {loading ? "AI 思考中..." : "AI 启发思路"}
                        </button>
                    )}
                    
                    {suggestion && (
                        <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-3 mt-2 text-sm text-indigo-800 animate-fade-in relative group">
                            <div className="flex items-start">
                                <Sparkles className="w-4 h-4 text-indigo-500 mr-2 mt-0.5 shrink-0" />
                                <div className="flex-1">
                                    <span className="font-semibold text-xs text-indigo-400 uppercase block mb-1">AI 建议</span>
                                    {suggestion}
                                </div>
                            </div>
                            <div className="mt-2 flex justify-end space-x-2">
                                <button 
                                    onClick={() => setSuggestion(null)}
                                    className="text-xs text-slate-400 hover:text-slate-600"
                                >
                                    关闭
                                </button>
                                <button 
                                    onClick={() => onResult(suggestion)}
                                    className="text-xs bg-indigo-200 text-indigo-800 px-2 py-1 rounded hover:bg-indigo-300 transition"
                                >
                                    填入内容
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 组件：设置模态框 ---
        const SettingsModal = ({ isOpen, onClose, apiKey, setApiKey }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                        <h3 className="text-xl font-bold mb-4 flex items-center">
                            <Settings className="w-5 h-5 mr-2" /> 设置
                        </h3>
                        <div className="mb-4">
                            <label className="block text-sm font-medium text-slate-700 mb-2">
                                OpenAI API Key
                            </label>
                            <input 
                                type="password" 
                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="sk-..."
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                            />
                            <p className="text-xs text-slate-500 mt-2">
                                * Key 仅保存在您的浏览器本地，用于直接调用 OpenAI 接口。我们不会上传您的 Key。
                            </p>
                        </div>
                        <div className="flex justify-end">
                            <button 
                                onClick={onClose}
                                className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
                            >
                                保存并关闭
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 组件：思维提示卡 ---
        const InsightCard = ({ title, content, icon: Icon }) => (
            <div className="bg-indigo-50 border-l-4 border-indigo-500 p-4 mb-6 rounded-r-lg animate-fade-in">
                <div className="flex items-start">
                    <div className="flex-shrink-0">
                        <Icon className="h-5 w-5 text-indigo-600 mt-0.5" />
                    </div>
                    <div className="ml-3">
                        <h3 className="text-sm font-medium text-indigo-800">{title}</h3>
                        <p className="mt-1 text-sm text-indigo-700">{content}</p>
                    </div>
                </div>
            </div>
        );

        // --- 主应用组件 ---
        function App() {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [formData, setFormData] = useState({
                surfaceRequest: '',
                triggerScenario: '',
                whys: ['', '', ''],
                rootCause: '',
                facts: '',
                assumptions: '',
                successMetric: '',
            });

            // AI 总结状态
            const [aiAnalysis, setAiAnalysis] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const scrollRef = useRef(null);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = 0;
                }
            }, [step]);

            // 在进入步骤 3 时自动触发 AI 分析
            useEffect(() => {
                if (step === 3 && !aiAnalysis && apiKey) {
                    performFinalAnalysis();
                }
            }, [step]);

            const performFinalAnalysis = async () => {
                setIsAnalyzing(true);
                const prompt = `
                    请作为一个极其严格的首席技术官(CTO)和产品专家，分析以下需求数据：
                    1. 原始需求: ${formData.surfaceRequest}
                    2. 触发场景: ${formData.triggerScenario}
                    3. 5Why分析链: ${formData.whys.join(" -> ")}
                    4. 用户归纳的根因: ${formData.rootCause}
                    5. 事实约束: ${formData.facts}
                    6. 假设: ${formData.assumptions}
                    7. 成功指标: ${formData.successMetric}

                    请输出 JSON 格式（不要Markdown代码块），包含以下字段：
                    - summary: 简明扼要的专业需求总结（100字以内）。
                    - refinedRootCause: 你认为更深层、更本质的核心问题是什么？
                    - score: 给这个需求挖掘的清晰度和深度打分（0-100）。
                    - scoreReason: 打分理由（一句话）。
                    - suggestion: 如果分数低于 80，给出具体的修改建议；如果高于 80，给出执行建议。
                `;
                
                try {
                    const resultStr = await callOpenAI(apiKey, [{role: "user", content: prompt}]);
                    // 尝试解析 JSON，如果 AI 返回了 markdown 代码块，做简单清理
                    const jsonStr = resultStr.replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(jsonStr);
                    setAiAnalysis(result);
                } catch (e) {
                    console.error(e);
                    // 如果解析失败或API错误，给个降级显示
                    setAiAnalysis({
                        summary: "AI 分析失败或格式错误，显示原始输入。",
                        refinedRootCause: formData.rootCause,
                        score: 0,
                        scoreReason: "API 连接问题或 Key 无效",
                        suggestion: "请检查网络或 Key 配置。"
                    });
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const handleWhyChange = (index, value) => {
                const newWhys = [...formData.whys];
                newWhys[index] = value;
                setFormData(prev => ({ ...prev, whys: newWhys }));
            };

            const nextStep = () => setStep(s => s + 1);
            const prevStep = () => setStep(s => s - 1);

            // Step 0
            const renderStep0 = () => (
                <div className="space-y-6 slide-in-from-right">
                    <div className="text-center mb-8">
                        <div className="inline-flex items-center justify-center p-3 bg-blue-100 rounded-full mb-4">
                            <Brain className="w-8 h-8 text-blue-600" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800">欢迎来到 TruthSeeker AI</h2>
                        <p className="text-slate-500 mt-2">人机协作，寻找问题的“最优解”。</p>
                    </div>

                    <InsightCard 
                        icon={Lightbulb}
                        title="第一性原理思维"
                        content="请暂时忘掉具体的'功能按钮'或'页面样式'。我们先关注'现状'与'阻碍'。"
                    />

                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                一句话描述：您想让我们做什么？(表面需求)
                            </label>
                            <input 
                                type="text" 
                                className="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm"
                                placeholder="例如：我想在后台增加一个 Excel 导出按钮..."
                                value={formData.surfaceRequest}
                                onChange={(e) => handleInputChange('surfaceRequest', e.target.value)}
                            />
                        </div>
                        
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                触发场景：在什么具体情况下，您产生了在这个念头？
                            </label>
                            <textarea 
                                className="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm h-24"
                                placeholder="例如：每周五做周报时，我需要手动把网页数据抄到 Excel 里算转化率，这花了我 2 小时..."
                                value={formData.triggerScenario}
                                onChange={(e) => handleInputChange('triggerScenario', e.target.value)}
                            />
                            {/* AI 辅助按钮 */}
                            <AIAssistButton 
                                context={formData.triggerScenario || formData.surfaceRequest} 
                                promptType="trigger" 
                                apiKey={apiKey}
                                onResult={(text) => handleInputChange('triggerScenario', formData.triggerScenario + " " + text)}
                            />
                        </div>
                    </div>
                </div>
            );

            // Step 1
            const renderStep1 = () => (
                <div className="space-y-6 slide-in-from-right">
                    <div className="mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                            <Search className="w-6 h-6 mr-2 text-purple-600" />
                            需求深潜 (The Deep Dive)
                        </h2>
                        <p className="text-slate-500 text-sm mt-1">就像剥洋葱一样，我们要找到痛苦的根源。</p>
                    </div>

                    <div className="relative border-l-2 border-purple-200 ml-4 pl-8 space-y-8">
                        
                        <div className="relative">
                            <span className="absolute -left-[41px] bg-purple-100 text-purple-600 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold border-2 border-white ring-2 ring-purple-50">1</span>
                            <label className="block text-sm font-medium text-slate-600 mb-1">
                                为什么需要 <span className="text-slate-900 font-bold">"{formData.surfaceRequest || '这个功能'}"</span>?
                            </label>
                            <input 
                                type="text" 
                                className="w-full p-3 bg-white border border-slate-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                placeholder="因为..."
                                value={formData.whys[0]}
                                onChange={(e) => handleWhyChange(0, e.target.value)}
                            />
                            <AIAssistButton 
                                context={formData.surfaceRequest} 
                                promptType="why" 
                                apiKey={apiKey}
                                onResult={(text) => handleWhyChange(0, text)}
                            />
                        </div>

                        {formData.whys[0] && (
                            <div className="relative animate-fade-in-up">
                                <span className="absolute -left-[41px] bg-purple-100 text-purple-600 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold border-2 border-white ring-2 ring-purple-50">2</span>
                                <label className="block text-sm font-medium text-slate-600 mb-1">
                                    这就导致了什么问题？或者为什么 <span className="text-slate-900 font-bold">"{formData.whys[0]}"</span> 很重要?
                                </label>
                                <input 
                                    type="text" 
                                    className="w-full p-3 bg-white border border-slate-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                    placeholder="这会导致..."
                                    value={formData.whys[1]}
                                    onChange={(e) => handleWhyChange(1, e.target.value)}
                                />
                                <AIAssistButton 
                                    context={formData.whys[0]} 
                                    promptType="why" 
                                    apiKey={apiKey}
                                    onResult={(text) => handleWhyChange(1, text)}
                                />
                            </div>
                        )}

                        {formData.whys[1] && (
                            <div className="relative animate-fade-in-up">
                                <span className="absolute -left-[41px] bg-purple-100 text-purple-600 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold border-2 border-white ring-2 ring-purple-50">3</span>
                                <label className="block text-sm font-medium text-slate-600 mb-1">
                                    再往深处看，这最终影响了业务的什么核心指标？
                                </label>
                                <input 
                                    type="text" 
                                    className="w-full p-3 bg-white border border-slate-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                    placeholder="最终影响了..."
                                    value={formData.whys[2]}
                                    onChange={(e) => handleWhyChange(2, e.target.value)}
                                />
                            </div>
                        )}
                    </div>

                    {formData.whys[2] && (
                        <div className="mt-8 bg-purple-50 p-4 rounded-lg border border-purple-100 animate-fade-in">
                            <label className="block text-sm font-bold text-purple-900 mb-2 flex items-center">
                                <Sparkles className="w-4 h-4 mr-1" />
                                归纳核心问题 (Root Cause)
                            </label>
                            <p className="text-xs text-purple-600 mb-2">基于上述回答，请重新定义我们要解决的问题。</p>
                            <textarea 
                                className="w-full p-3 border border-purple-200 rounded-md focus:ring-purple-500 focus:border-purple-500 h-24"
                                placeholder="例如：问题不在于没有导出按钮，而在于我们缺乏一个自动化的销售线索分配机制，导致效率低下。"
                                value={formData.rootCause}
                                onChange={(e) => handleInputChange('rootCause', e.target.value)}
                            />
                        </div>
                    )}
                </div>
            );

            // Step 2
            const renderStep2 = () => (
                <div className="space-y-6 slide-in-from-right">
                    <div className="mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                            <Layers className="w-6 h-6 mr-2 text-emerald-600" />
                            解构与重构 (Constraints)
                        </h2>
                        <p className="text-slate-500 text-sm mt-1">区分什么是“物理定律”，什么是“思维惯性”。</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <div className="flex items-center mb-3">
                                <ShieldAlert className="w-5 h-5 text-red-500 mr-2" />
                                <h3 className="font-bold text-slate-700">基本事实 (公理)</h3>
                            </div>
                            <p className="text-xs text-slate-500 mb-3">
                                绝对不可改变的限制（如：法律法规、物理时间、必须保护用户隐私）。
                            </p>
                            <textarea 
                                className="w-full p-3 border border-slate-300 rounded-md h-32 text-sm"
                                placeholder="例如：数据必须在内网存储；预算不能超过1万..."
                                value={formData.facts}
                                onChange={(e) => handleInputChange('facts', e.target.value)}
                            />
                        </div>

                        <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
                            <div className="flex items-center mb-3">
                                <Brain className="w-5 h-5 text-emerald-600 mr-2" />
                                <h3 className="font-bold text-emerald-800">可变假设 (挑战)</h3>
                            </div>
                            <p className="text-xs text-emerald-600 mb-3">
                                我们以为必须这样做，但其实可以被挑战的观念。
                            </p>
                            <textarea 
                                className="w-full p-3 border border-emerald-200 rounded-md h-32 text-sm focus:ring-emerald-500 focus:border-emerald-500"
                                placeholder="例如：必须用Excel才能分析（假如系统自带图表呢？）；必须人工审核（假如AI能预审呢？）..."
                                value={formData.assumptions}
                                onChange={(e) => handleInputChange('assumptions', e.target.value)}
                            />
                            <AIAssistButton 
                                context={formData.surfaceRequest + " " + formData.facts} 
                                promptType="constraint" 
                                apiKey={apiKey}
                                onResult={(text) => handleInputChange('assumptions', formData.assumptions + " " + text)}
                            />
                        </div>
                    </div>

                    <div className="mt-4">
                        <label className="block text-sm font-semibold text-slate-700 mb-2">
                            成功指标 (Success Metrics)
                        </label>
                        <div className="flex flex-col space-y-2">
                            <div className="flex items-center bg-white border border-slate-300 rounded-lg p-2 focus-within:ring-2 focus-within:ring-blue-500">
                                <Target className="w-5 h-5 text-slate-400 ml-2" />
                                <input 
                                    type="text" 
                                    className="w-full p-2 border-none focus:ring-0 text-slate-700"
                                    placeholder="怎样才算解决了问题？例如：线索分配时间从 3 小时缩短到 5 分钟。"
                                    value={formData.successMetric}
                                    onChange={(e) => handleInputChange('successMetric', e.target.value)}
                                />
                            </div>
                            <AIAssistButton 
                                context={formData.rootCause} 
                                promptType="metric" 
                                apiKey={apiKey}
                                onResult={(text) => handleInputChange('successMetric', text)}
                            />
                        </div>
                    </div>
                </div>
            );

            // Step 3
            const renderStep3 = () => (
                <div className="zoom-in-95 pb-20">
                    <div className="text-center mb-6">
                        <div className="inline-flex items-center justify-center p-3 bg-green-100 rounded-full mb-4">
                            <CheckCircle className="w-8 h-8 text-green-600" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800">思维重构完成</h2>
                        <p className="text-slate-500 mt-2">
                            {isAnalyzing ? "AI 正在生成洞察报告..." : "这是基于第一性原理生成的“真实需求书”。"}
                        </p>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden relative">
                        {isAnalyzing && (
                            <div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center">
                                <Loader className="w-10 h-10 text-blue-600 mb-3" />
                                <p className="text-blue-800 font-medium">正在计算需求清晰度分数...</p>
                            </div>
                        )}

                        <div className="bg-slate-50 border-b border-slate-200 p-4 flex justify-between items-center">
                            <h3 className="font-bold text-slate-700">需求洞察卡 (Insight Card)</h3>
                            <button 
                                onClick={() => {
                                    const text = `核心问题: ${aiAnalysis?.refinedRootCause || formData.rootCause}\n背景: ${aiAnalysis?.summary || formData.triggerScenario}\n成功指标: ${formData.successMetric}`;
                                    navigator.clipboard.writeText(text);
                                    alert('已复制到剪贴板');
                                }}
                                className="text-xs flex items-center text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-full transition"
                            >
                                <Copy className="w-3 h-3 mr-1" /> 复制内容
                            </button>
                        </div>

                        <div className="p-6 space-y-6">
                            {/* AI Summary Section */}
                            {aiAnalysis && (
                                <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100 mb-6">
                                    <div className="flex justify-between items-start mb-2">
                                        <h4 className="font-bold text-indigo-900 flex items-center">
                                            <Sparkles className="w-4 h-4 mr-2" /> AI 智能摘要
                                        </h4>
                                        <span className={`px-2 py-1 rounded text-xs font-bold ${aiAnalysis.score >= 80 ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800'}`}>
                                            清晰度得分: {aiAnalysis.score}/100
                                        </span>
                                    </div>
                                    <p className="text-sm text-indigo-800 mb-2">{aiAnalysis.summary}</p>
                                    <div className="text-xs text-indigo-600 border-t border-indigo-200 pt-2 mt-2">
                                        <strong>💡 建议:</strong> {aiAnalysis.suggestion}
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="col-span-1">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">原始诉求 (Original)</span>
                                    <p className="mt-1 text-slate-500 line-through text-sm">{formData.surfaceRequest}</p>
                                </div>
                                <div className="col-span-1 md:col-span-2">
                                    <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">重构核心 (Reconstructed)</span>
                                    <p className="mt-1 text-slate-800 font-semibold text-lg">
                                        {aiAnalysis?.refinedRootCause || formData.rootCause || "未填写核心问题"}
                                    </p>
                                </div>
                            </div>

                            <hr className="border-slate-100" />

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-red-50 p-3 rounded border border-red-100">
                                    <span className="text-xs font-bold text-red-600 uppercase">不可逾越的边界</span>
                                    <p className="mt-1 text-sm text-red-800">{formData.facts || "无特殊限制"}</p>
                                </div>
                                <div className="bg-green-50 p-3 rounded border border-green-100">
                                    <span className="text-xs font-bold text-green-600 uppercase">成功的定义</span>
                                    <p className="mt-1 text-sm text-green-800">{formData.successMetric || "未定义"}</p>
                                </div>
                            </div>
                        </div>

                        {!aiAnalysis && !apiKey && (
                            <div className="bg-orange-50 p-4 text-center border-t border-orange-200">
                                <p className="text-xs text-orange-600">
                                    提示: 配置 API Key 后可解锁“AI 评分”与“智能摘要”功能。
                                </p>
                            </div>
                        )}
                    </div>
                    
                    <div className="mt-8 text-center space-x-4">
                         <button 
                            onClick={performFinalAnalysis}
                            disabled={isAnalyzing || !apiKey}
                            className="text-indigo-600 hover:text-indigo-800 text-sm underline disabled:opacity-50"
                        >
                            重新分析
                        </button>
                        <button 
                            onClick={() => window.location.reload()}
                            className="text-slate-500 hover:text-slate-800 text-sm underline"
                        >
                            提交新需求
                        </button>
                    </div>
                </div>
            );

            const steps = [
                { title: "现象", icon: Brain },
                { title: "深挖", icon: Search },
                { title: "解构", icon: Layers },
                { title: "重构", icon: CheckCircle },
            ];

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={() => setIsSettingsOpen(false)}
                        apiKey={apiKey}
                        setApiKey={setApiKey}
                    />

                    {/* Sidebar */}
                    <div className="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between shrink-0">
                        <div>
                            <div className="flex items-center space-x-2 mb-10">
                                <div className="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                                    <span className="font-bold text-xl">T</span>
                                </div>
                                <span className="text-xl font-bold tracking-tight">TruthSeeker</span>
                            </div>

                            <nav className="space-y-1">
                                {steps.map((s, idx) => (
                                    <div 
                                        key={idx}
                                        className={`flex items-center px-4 py-3 rounded-lg transition-all duration-200 ${
                                            step === idx 
                                                ? 'bg-blue-600 text-white shadow-lg translate-x-1' 
                                                : step > idx 
                                                    ? 'text-blue-300' 
                                                    : 'text-slate-500'
                                        }`}
                                    >
                                        <s.icon className={`w-5 h-5 mr-3 ${step === idx ? 'animate-pulse' : ''}`} />
                                        <span className="font-medium text-sm">{s.title}</span>
                                        {step > idx && <CheckCircle className="w-4 h-4 ml-auto" />}
                                    </div>
                                ))}
                            </nav>
                        </div>

                        <div className="mt-10 md:mt-0 flex flex-col gap-4">
                             <div className="p-4 bg-slate-800 rounded-xl">
                                <p className="text-xs text-slate-400 font-semibold uppercase mb-2">当前思维模式</p>
                                <p className="text-sm text-slate-300 leading-relaxed">
                                    {step === 0 && "像个新手一样观察。不要预设解决方案。"}
                                    {step === 1 && "像个好奇的孩子一样，不停地问为什么。"}
                                    {step === 2 && "像个物理学家一样，区分事实与假设。"}
                                    {step === 3 && "像个建筑师一样，基于根基构建蓝图。"}
                                </p>
                            </div>
                            
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="flex items-center justify-center p-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700"
                            >
                                <Settings className="w-4 h-4 mr-2" />
                                {apiKey ? "API Key 已配置" : "配置 OpenAI Key"}
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <div className="md:hidden h-1 bg-slate-200 w-full">
                            <div 
                                className="h-full bg-blue-500 transition-all duration-300" 
                                style={{ width: `${((step + 1) / steps.length) * 100}%` }}
                            />
                        </div>

                        <main className="flex-1 overflow-y-auto p-4 md:p-10" ref={scrollRef}>
                            <div className="max-w-2xl mx-auto pb-20">
                                {step === 0 && renderStep0()}
                                {step === 1 && renderStep1()}
                                {step === 2 && renderStep2()}
                                {step === 3 && renderStep3()}
                            </div>
                        </main>

                        <footer className="bg-white border-t border-slate-200 p-4 md:px-10 py-4 flex justify-between items-center shrink-0 z-10">
                            <button 
                                onClick={prevStep}
                                disabled={step === 0 || step === 3}
                                className={`flex items-center px-6 py-2 rounded-lg text-sm font-semibold transition ${
                                    step === 0 || step === 3
                                        ? 'text-slate-300 cursor-not-allowed' 
                                        : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <ArrowLeft className="w-4 h-4 mr-2" />
                                上一步
                            </button>

                            <div className="flex space-x-2">
                                {step < 3 ? (
                                    <button 
                                        onClick={nextStep}
                                        disabled={
                                            (step === 0 && !formData.surfaceRequest) ||
                                            (step === 1 && !formData.rootCause)
                                        }
                                        className={`flex items-center px-8 py-3 rounded-lg text-sm font-semibold shadow-md transition-all ${
                                            (step === 0 && !formData.surfaceRequest) || (step === 1 && !formData.rootCause)
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                                : 'bg-blue-600 hover:bg-blue-700 text-white hover:shadow-lg hover:-translate-y-0.5'
                                        }`}
                                    >
                                        {step === 2 ? '生成洞察报告' : '下一步'}
                                        <ArrowRight className="w-4 h-4 ml-2" />
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => alert("已发送给研发团队！我们将针对'核心问题'进行排期。")}
                                        className="flex items-center px-8 py-3 rounded-lg text-sm font-semibold shadow-md bg-green-600 hover:bg-green-700 text-white transition-all hover:shadow-lg hover:-translate-y-0.5"
                                    >
                                        提交给研发团队
                                        <CheckCircle className="w-4 h-4 ml-2" />
                                    </button>
                                )}
                            </div>
                        </footer>
                    </div>
                </div>
            );
        }

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
